apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nucleus-public
  namespace: nucleus
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/pass-to-target: "true"
spec:
  tls:
    - hosts:
        - nucleus.soleusforce.cn
      secretName: nucleus-ingress-cert
  rules:
    - host: nucleus.soleusforce.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nucleus
                port:
                  number: 80
