apiVersion: apps/v1
kind: Deployment
metadata:
  name: nucleus
  namespace: nucleus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nucleus
  template:
    metadata:
      labels:
        app: nucleus
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: tcr-image-pull
      tolerations:
        - key: workload
          operator: Equal
          value: intnovel-staging-business
          effect: NoSchedule
      containers:
        - name: nucleus
          image: ccr.ccs.tencentyun.com/intnovel/nucleus@sha256:39f761acdcfc1de37cc9d33ffe5021818e4845c5beda5df40517807463c7c014
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: nucleus-runtime-secrets
          env:
            - name: LLM_BASE_URL
              value: https://api.deepseek.com
            - name: LLM_MODEL
              value: deepseek-flash
            - name: LLM_STREAM_IDLE_TIMEOUT_MS
              value: "60000"
            - name: LLM_FALLBACK_MODEL
              value: deepseek-v4-pro
            - name: LLM_VISION_MODEL
              value: deepseek-flash
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nucleus-deepseek-secrets
                  key: LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nucleus
  namespace: nucleus
spec:
  type: NodePort
  selector:
    app: nucleus
  ports:
    - name: http
      port: 80
      targetPort: 8080
